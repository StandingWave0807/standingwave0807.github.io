<main id="main">
  <h1>在分子、矩阵和编译器之间找同一个结构</h1>
  <p class="lede">域名里的 phenol 是酚酞的酚。酚酞遇碱会从无色变成品红，这个站的全部配色都取自那一步反应。下面三个分子就是它的说明书——切换、拖 pH。</p>

  <section id="molecule">
    <div class="sec-head">
      <h2>三种酚</h2>
      <span class="sec-note">结构示意</span>
    </div>
    <div class="panel">
      <div class="panel-top">
        <div class="tabs" id="tabs" role="tablist" aria-label="选择分子">
          <span id="tab-pill" aria-hidden="true"></span>
          <button class="tab" role="tab" id="tab-phenol" aria-selected="true" aria-controls="stage" data-mol="phenol" tabindex="0">苯酚</button>
          <button class="tab" role="tab" id="tab-catechol" aria-selected="false" aria-controls="stage" data-mol="catechol" tabindex="-1">邻苯二酚</button>
          <button class="tab" role="tab" id="tab-phenolp" aria-selected="false" aria-controls="stage" data-mol="phenolphthalein" tabindex="-1">酚酞</button>
        </div>
        <span class="panel-formula" id="formula">C₆H₅OH</span>
      </div>
      <div class="stage" id="stage" role="tabpanel" aria-labelledby="tab-phenol" tabindex="-1"></div>
      <p class="panel-note" id="mol-note"></p>
      <div class="ph" id="ph" hidden>
        <label for="ph-range">pH</label>
        <input id="ph-range" type="range" min="0" max="14" step="0.1" value="7" aria-describedby="ph-out">
        <span class="swatch" id="ph-swatch" aria-hidden="true"></span>
        <output id="ph-out" for="ph-range"></output>
      </div>
    </div>
  </section>
