<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>机改小测 · 模型雷达图</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<style>
:root{--bg:#fff;--fg:#111;--dim:#6b6b6b;--line:#111;--soft:#e6e6e6;--hover:#f3f3f3;--ok:#1f7a3a;--okbg:#e9f5ec;--bad:#b42318;--badbg:#fdecea;--code:#fafafa}
html.dark{--bg:#15171a;--fg:#e7e7e4;--dim:#9a9a96;--line:#e7e7e4;--soft:#2c2f34;--hover:#1f2226;--ok:#5fd28a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;--code:#1c1f23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.6}
code,pre,textarea,.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header a{color:var(--fg);text-decoration:none;font-weight:700}
header .sp{flex:1}
button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:5px 12px;border-radius:6px;cursor:pointer}
button:hover{background:var(--hover)}
button.pri{background:var(--fg);color:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{order:-1;position:static}}
h1{font-size:26px;margin:4px 0 6px;font-weight:800}
.lead{color:var(--dim);margin:0 0 18px;font-size:14px}
.step{border:1.5px solid var(--soft);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.step h2{font-size:15px;margin:0 0 8px}
textarea{width:100%;min-height:120px;padding:10px;border:1.5px solid var(--soft);border-radius:8px;background:var(--code);color:var(--fg);font-size:13px;resize:vertical}
input[type=text]{font:inherit;width:100%;padding:6px 10px;border:1.5px solid var(--soft);border-radius:6px;background:var(--bg);color:var(--fg)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.q{border-top:1px solid var(--soft);padding:14px 0}
.q .hd{display:flex;gap:8px;align-items:baseline}
.q .no{font-weight:800;min-width:28px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--soft);color:var(--dim);white-space:nowrap}
.q pre{background:var(--code);border:1px solid var(--soft);border-radius:6px;padding:8px 10px;margin:6px 0;font-size:13px;overflow:auto}
.q input{margin-top:6px}
.q.ok input{border-color:var(--ok);background:var(--okbg)}
.q.bad input{border-color:var(--bad);background:var(--badbg)}
.fb{font-size:13px;margin-top:4px;min-height:0}
.q.ok .fb{color:var(--ok)}.q.bad .fb{color:var(--bad)}
.side{position:sticky;top:70px;align-self:start}
.card{border:2px solid var(--line);border-radius:12px;padding:14px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-size:12px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px}
.legend .it{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .sc{font-weight:700}
.legend button{padding:0 7px;font-size:12px;border-width:1px}
.legend .it.off{opacity:.4}
.legend .nm{cursor:pointer}
.total{font-size:30px;font-weight:800}
.dim{color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <a href="/">永远的邻苯二酚</a><span class="dim">/ 机改小测</span>
  <span class="sp"></span>
  <button id="btnTheme">暗色</button>
</header>

<div class="wrap">
<main>
  <h1>机改小测 · 模型雷达图</h1>
  <p class="lead">12 道填空题，六个维度各两题，全部由本页自动判分。把题目发给模型，把它的回答整段粘回来，就能得到一张雷达图；多测几个模型可以叠在一起比。成绩只存在这台设备上。</p>

  <div class="step">
    <h2>① 复制题目发给模型</h2>
    <div class="dim">复制的内容已附上答题格式要求，模型照做就能自动识别。</div>
    <div class="row"><button class="pri" id="btnCopy">复制全部题目</button><button id="btnShow">查看提示词</button></div>
    <textarea id="prompt" readonly hidden></textarea>
  </div>

  <div class="step">
    <h2>② 粘贴模型的整段回答</h2>
    <textarea id="paste" placeholder="把模型的回答整段粘到这里，末尾形如：&#10;1: …&#10;2: …"></textarea>
    <div class="row">
      <input type="text" id="model" placeholder="模型名称，如 GPT-5 / DeepSeek / 自己" style="flex:1;min-width:180px">
      <button class="pri" id="btnGrade">识别并判分</button>
      <button id="btnClear">清空</button>
    </div>
    <div class="dim" style="margin-top:6px">也可以不粘贴，直接在下面每题的空里填答案，再点判分。</div>
  </div>

  <div id="qs"></div>
  <div class="row" style="margin:6px 0 40px"><button class="pri" id="btnGrade2">判分并加入雷达图</button></div>
</main>

<aside class="side">
  <div class="card">
    <div class="row" style="margin:0;justify-content:space-between">
      <div><div class="dim">本次得分</div><div class="total" id="total">—</div></div>
      <div class="dim" id="totalSub" style="text-align:right"></div>
    </div>
    <svg id="radar" viewBox="0 0 340 320" aria-label="雷达图"></svg>
    <div class="legend" id="legend"></div>
    <div class="row"><button id="btnPng">保存图片</button><button id="btnReset">清空记录</button></div>
  </div>
</aside>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var DIMS=['知识','数学','推理','代码','指令遵循','字符感知'];
function nz(s){ // 全角转半角、去首尾空白
  return String(s==null?'':s).replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0)}).replace(/\u3000/g,' ').trim();
}
function loose(s){return nz(s).replace(/[`*"'“”‘’。．.，、\s]/g,'').toLowerCase()}
function nums(s){return (nz(s).match(/-?\d+/g)||[]).map(Number)}
var Q=[
 {d:0,t:'1828 年，维勒（Wöhler）用无机物首次人工合成的有机物是＿＿。',a:'尿素',c:function(s){return /尿素|^脲$|urea|carbamide/i.test(loose(s))}},
 {d:0,t:'向苯酚溶液中滴加过量浓溴水，生成的白色沉淀是＿＿（写化学名称）。',a:'2,4,6-三溴苯酚',c:function(s){var x=nz(s).replace(/[\s，、]/g,function(c){return c===' '?'':','});return /2,4,6-?三溴苯酚|2,4,6-?tribromophenol/i.test(x)}},
 {d:1,t:'2 的 100 次方除以 7，余数是＿＿。',a:'2',c:function(s){var n=nums(s);return n.length===1&&n[0]===2}},
 {d:1,t:'1 到 1000 的整数中，既不能被 2 整除、也不能被 3 整除、也不能被 5 整除的有＿＿个。',a:'266',c:function(s){var n=nums(s);return n.length===1&&n[0]===266}},
 {d:2,t:'A、B、C、D、E 五人坐成一排。已知：A 与 B 相邻；B 坐在最左或最右；C 在 D 的右边（不一定相邻）；E 不坐两端；A 与 E 不相邻；A 在 C 的左边。从左到右的顺序是＿＿（写 5 个字母）。',a:'BADEC',c:function(s){return nz(s).toUpperCase().replace(/[^A-E]/g,'')==='BADEC'}},
 {d:2,t:'岛上的人要么永远说真话，要么永远说假话。A 说：“B 说假话。”B 说：“A 和 C 是同一类人。”C 说：“A 说真话。”三人中说真话的是＿＿（写字母，可能不止一个）。',a:'B',c:function(s){var x=nz(s).toUpperCase().replace(/[^ABC]/g,'');return x==='B'}},
 {d:3,t:'下面 Python 代码的输出是＿＿。',code:'x = [1, 2, 3]\ny = x\ny += [4]\nx = x + [5]\nprint(len(y), len(x))',a:'4 5',c:function(s){var n=nums(s);return n.length===2&&n[0]===4&&n[1]===5}},
 {d:3,t:'下面 JavaScript 代码的输出是＿＿。',code:'console.log([10, 1, 3].sort().join(","))',a:'1,10,3',c:function(s){return loose(s).replace(/[\[\]]/g,'')==='1,10,3'}},
 {d:4,t:'写一句英文：恰好 7 个单词，全部小写，不含任何标点和数字，最后一个单词必须是 phenol。（只写这句话本身）',a:'例：we all love the smell of phenol',c:function(s){var x=String(s).trim().replace(/^[`"]+|[`"]+$/g,'');return /^[a-z]+( [a-z]+){6}$/.test(x)&&/ phenol$/.test(x)}},
 {d:4,t:'把 50 到 70 之间的所有质数从大到小排列，用英文逗号分隔，不加空格，不加任何其他字符。',a:'67,61,59,53',c:function(s){return String(s).trim().replace(/^`+|`+$/g,'')==='67,61,59,53'}},
 {d:5,t:'字符串 "strawberry raspberry cranberry" 中，字母 r 一共出现＿＿次。',a:'9',c:function(s){var n=nums(s);return n.length===1&&n[0]===9}},
 {d:5,t:'把字符串 "phenolforever" 逐字倒序写出：＿＿。',a:'reveroflonehp',c:function(s){return loose(s)==='reveroflonehp'}}
];
var $=function(id){return document.getElementById(id)};

function buildPrompt(){
  var L=['请回答下面 12 道题。可以先思考，但最后必须单独输出一个“答案”部分，每题一行，格式为“题号: 答案”，只写最终答案，不加解释。例如：','1: xxx','2: xxx','',''];
  Q.forEach(function(q,i){L.push((i+1)+'. '+q.t);if(q.code)L.push('```\n'+q.code+'\n```');L.push('')});
  L.push('答案：');
  return L.join('\n');
}
$('prompt').value=buildPrompt();

var box=$('qs');
Q.forEach(function(q,i){
  var d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div class="hd"><span class="no">'+(i+1)+'</span><span style="flex:1"></span><span class="tag">'+DIMS[q.d]+'</span></div>';
  var p=document.createElement('div');p.textContent=q.t;d.querySelector('.hd span:nth-child(2)').appendChild(p);
  if(q.code){var pre=document.createElement('pre');pre.textContent=q.code;d.appendChild(pre)}
  var inp=document.createElement('input');inp.type='text';inp.placeholder='你的答案';inp.id='a'+i;d.appendChild(inp);
  var fb=document.createElement('div');fb.className='fb';d.appendChild(fb);
  box.appendChild(d);
});

function parse(text){
  var out={},lines=String(text).split(/\r?\n/);
  // 只看最后一个“答案”标题之后的部分（若有）
  var start=0;for(var i=0;i<lines.length;i++){if(/^\s*[#*\s]*(最终)?答案\s*[:：]?\s*[*]*\s*$/.test(lines[i]))start=i+1}
  for(var j=start;j<lines.length;j++){
    var m=nz(lines[j]).replace(/^[-*>\s]+/,'').replace(/^\*\*(\d+)\*\*/,'$1').match(/^(?:第\s*)?(\d{1,2})\s*(?:题)?\s*[:.、)]\s*(.*)$/);
    if(m){var k=+m[1];if(k>=1&&k<=Q.length)out[k]=m[2].replace(/\*\*/g,'').trim()}
  }
  return out;
}

function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on')},1800)}

function grade(save){
  var per=DIMS.map(function(){return[0,0]}),got=0,res=[];
  Q.forEach(function(q,i){
    var v=$('a'+i).value,ok=v.trim()!==''&&q.c(v);
    per[q.d][1]++;if(ok){per[q.d][0]++;got++}
    var el=$('q'+i);el.classList.remove('ok','bad');el.classList.add(ok?'ok':'bad');
    el.querySelector('.fb').textContent=ok?'✓ 正确':'✗ 参考答案：'+q.a;
    res.push(ok?1:0);
  });
  var sc=per.map(function(p){return Math.round(p[0]/p[1]*100)});
  $('total').textContent=got+' / '+Q.length;
  $('totalSub').textContent=Math.round(got/Q.length*100)+' 分';
  if(save){
    var name=$('model').value.trim()||('测试 '+(runs.length+1));
    runs.push({name:name,sc:sc,got:got,res:res,t:Date.now(),on:true});
    if(runs.length>8)runs.shift();
    store();draw();
  }
  return got;
}

var KEY='bench-runs-v1',runs=[];
try{runs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){runs=[]}
function store(){try{localStorage.setItem(KEY,JSON.stringify(runs))}catch(e){}}
var COL=['#e4572e','#2e86ab','#29a745','#9b5de5','#f2a541','#d1495b','#00a6a6','#6c757d'];

function draw(){
  var svg=$('radar'),cx=170,cy=165,R=118,n=DIMS.length,h='';
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  [25,50,75,100].forEach(function(v){
    var p=DIMS.map(function(_,i){return pt(i,R*v/100).join(',')}).join(' ');
    h+='<polygon points="'+p+'" fill="none" stroke="var(--soft)" stroke-width="1"/>';
  });
  DIMS.forEach(function(d,i){
    var e=pt(i,R),l=pt(i,R+20);
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--soft)"/>';
    var anc=Math.abs(l[0]-cx)<5?'middle':(l[0]<cx?'end':'start');
    h+='<text x="'+l[0]+'" y="'+(l[1]+4)+'" text-anchor="'+anc+'">'+d+'</text>';
  });
  h+='<text x="'+(cx+3)+'" y="'+(cy-R*0.5+4)+'" style="font-size:9px;fill:var(--dim)">50</text>';
  runs.forEach(function(r,k){
    if(!r.on)return;var c=COL[k%COL.length];
    var p=r.sc.map(function(v,i){return pt(i,R*Math.max(v,2)/100).join(',')}).join(' ');
    h+='<polygon points="'+p+'" fill="'+c+'" fill-opacity=".14" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/>';
    r.sc.forEach(function(v,i){var q=pt(i,R*Math.max(v,2)/100);h+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="'+c+'"/>'});
  });
  if(!runs.length)h+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" style="fill:var(--dim)">判分后这里出图</text>';
  svg.innerHTML=h;
  var lg=$('legend');lg.innerHTML='';
  runs.forEach(function(r,k){
    var it=document.createElement('div');it.className='it'+(r.on?'':' off');
    it.innerHTML='<span class="sw" style="background:'+COL[k%COL.length]+'"></span><span class="nm"></span><span class="sc">'+r.got+'/'+Q.length+'</span><button title="删除">×</button>';
    it.querySelector('.nm').textContent=r.name;it.querySelector('.nm').title=r.name+'（点击显示/隐藏）';
    it.querySelector('.nm').onclick=function(){r.on=!r.on;store();draw()};
    it.querySelector('button').onclick=function(){runs.splice(k,1);store();draw()};
    lg.appendChild(it);
  });
}
draw();

$('btnShow').onclick=function(){var t=$('prompt');t.hidden=!t.hidden;if(!t.hidden)t.style.minHeight='260px'};
$('btnCopy').onclick=function(){
  var t=$('prompt').value;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('已复制，发给模型吧')},function(){
    var e=$('prompt');e.hidden=false;e.select();try{document.execCommand('copy');toast('已复制')}catch(x){toast('请手动复制')}
  });
};
function fromPaste(){
  var a=parse($('paste').value),n=Object.keys(a).length;
  if(!n){toast('没识别到“题号: 答案”格式的行');return false}
  Q.forEach(function(_,i){$('a'+i).value=a[i+1]||''});
  toast('识别到 '+n+' 题');return true;
}
$('btnGrade').onclick=function(){if($('paste').value.trim()){if(!fromPaste())return}grade(true)};
$('btnGrade2').onclick=function(){grade(true);window.scrollTo({top:0,behavior:'smooth'})};
$('btnClear').onclick=function(){$('paste').value='';Q.forEach(function(_,i){$('a'+i).value='';var el=$('q'+i);el.classList.remove('ok','bad');el.querySelector('.fb').textContent=''});$('total').textContent='—';$('totalSub').textContent=''};
$('btnReset').onclick=function(){if(confirm('清空所有雷达图记录？')){runs=[];store();draw()}};
$('btnPng').onclick=function(){
  var svg=$('radar'),cs=getComputedStyle(document.documentElement),s=new XMLSerializer().serializeToString(svg);
  ['--fg','--soft','--dim','--bg'].forEach(function(v){s=s.split('var('+v+')').join(cs.getPropertyValue(v).trim())});
  s=s.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
  var img=new Image();img.onload=function(){
    var c=document.createElement('canvas'),k=3;c.width=340*k;c.height=(320+runs.length*22+10)*k;var g=c.getContext('2d');g.scale(k,k);
    g.fillStyle=cs.getPropertyValue('--bg').trim();g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,340,320);
    g.font='13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    runs.forEach(function(r,k2){if(!r.on)return;g.fillStyle=COL[k2%COL.length];g.fillRect(20,326+k2*22,12,12);g.fillStyle=cs.getPropertyValue('--fg').trim();g.fillText(r.name+'  '+r.got+'/'+Q.length+'  '+r.sc.join(' / '),40,337+k2*22)});
    var a=document.createElement('a');a.download='radar.png';a.href=c.toDataURL('image/png');a.click();
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
};
window.__bench={Q:Q,parse:parse,grade:grade};
})();
</script>
</body>
</html>
